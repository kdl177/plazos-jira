modules:
  jira:issuePanel:
    - key: plazos-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Court deadline
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:projectSettingsPage:
    - key: plazos-holidays
      resource: settings
      resolver:
        function: resolver
      render: native
      title: Court holidays
  rovo:agent:
    - key: plazos-agent
      name: Deadline Clerk
      description: Computes Spanish procedural deadlines (art. 183 LOPJ) and reports which case deadlines in Jira are close or overdue.
      prompt: >
        You are the deadline clerk of a Spanish law firm that tracks its cases in Jira.
        You compute procedural deadlines under art. 183 LOPJ and report which case deadlines are close.

        Jobs:

        a. Compute a deadline. You need the notification date (YYYY-MM-DD), the amount and the unit
        (business days, calendar days or months). Ask for whatever is missing. Treat the matter as
        urgent only when the user says so. Call compute-deadline, passing the project key from the
        context when there is one so the project's regional and local holidays apply. Reply with the
        date, the rule applied and a reminder that the lawyer must confirm it in the issue's
        "Court deadline" panel.

        b. List upcoming deadlines. Call list-deadlines with the project key from the context and the
        number of days the user asks for (default 7). Reply with a table: issue, due date, days left,
        confirmed. Overdue deadlines go first.

        Guardrails: never invent or compute a date yourself; every date comes from an action.
        Write dates as YYYY-MM-DD. Do not give legal advice beyond the computation rules.
      conversationStarters:
        - Which court deadlines expire this week?
        - Compute a 20 business-day deadline from a notification received today
        - Compute a 2 month deadline from 2026-06-15
      actions:
        - compute-deadline
        - list-deadlines
  action:
    - key: compute-deadline
      name: Compute court deadline
      function: computeDeadline
      actionVerb: GET
      description: >
        Computes the last day of a Spanish procedural deadline (art. 183 LOPJ) from a notification date,
        an amount and a unit, applying the project's extra holidays. Returns the date and the rule applied.
      inputs:
        notified:
          title: Notification date
          type: string
          required: true
          description: Date the party was notified, in YYYY-MM-DD.
        amount:
          title: Amount
          type: string
          required: true
          description: Number of units to count, a positive integer.
        unit:
          title: Unit
          type: string
          required: true
          description: One of business (días hábiles), calendar (días naturales) or months (meses).
        urgent:
          title: Urgent matter
          type: string
          required: false
          description: Set to true when the matter is urgent, so August and the Christmas break count as working days.
        projectKey:
          title: Project key
          type: string
          required: false
          description: Jira project key, so the project's regional and local holidays apply.
    - key: list-deadlines
      name: List court deadlines
      function: listDeadlines
      actionVerb: GET
      description: >
        Lists the court deadlines stored by the app that expire within a number of days, or are already
        overdue, with their issue key, due date, days left and whether the lawyer confirmed them.
      inputs:
        days:
          title: Days ahead
          type: string
          required: false
          description: Only deadlines due within this many days (default 7). Overdue ones are always included.
        projectKey:
          title: Project key
          type: string
          required: false
          description: Restrict to one Jira project.
  scheduledTrigger:
    - key: plazos-daily
      function: dailyNotices
      interval: day
  function:
    - key: resolver
      handler: index.handler
    - key: computeDeadline
      handler: index.computeDeadline
    - key: listDeadlines
      handler: index.listDeadlines
    - key: dailyNotices
      handler: index.dailyNotices
resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: settings
    path: src/frontend/settings.jsx
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/REPLACE-WITH-FORGE-REGISTER
